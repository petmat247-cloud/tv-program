name: Aktualizace TV programu (EPG)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stažení a zpracování EPG dat
        run: python TV-Web/scripts/fetch_epg.py --output TV-Web/public/epg_data.json --days 7

      - name: Uložení aktualizovaného JSON do repozitáře
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet TV-Web/public/epg_data.json; then
            echo "EPG data jsou beze změny, přeskakuji commit."
          else
            git add TV-Web/public/epg_data.json
            git commit -m "chore: aktualizace EPG dat [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
            echo "EPG data úspěšně aktualizována a odeslána."
          fi
